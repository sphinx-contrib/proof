repos:
-   repo: https://github.com/ambv/black
    rev: 26.10.1
    hooks:
    - id: black
- repo: https://github.com/pycqa/isort
  rev: 10.0.0b1
  hooks:
    - id: isort
      name: isort (python)
- repo: https://github.com/asottile/pyupgrade
  rev: v3.22.0
  hooks:
  - id: pyupgrade
    args: [--py38-plus]
